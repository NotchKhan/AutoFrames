services:
  - type: web
    name: autoframes-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: MAX_TOTAL_SIZE_MB
        value: "2048"
      - key: MAX_IMAGE_COUNT
        value: "500"
      - key: MAX_AUDIO_TRACKS
        value: "20"
      - key: PROJECT_TTL_HOURS
        value: "24"
      - key: SCRATCH_RESERVE_MIN_MB
        value: "64"
      - key: SCRATCH_RESERVE_MAX_MB
        value: "128"
      - key: STORAGE_RESERVE_PERCENT
        value: "10"
      - key: SCRATCH_ROOT
        value: /tmp/autoframes/work
      - key: OUTPUT_ROOT
        value: /tmp/autoframes/output
      - key: OPENAI_TRANSCRIPTION_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_LANGUAGE
        value: "ru"
      - key: OPENAI_TRANSCRIPTION_MAX_MINUTES_PER_HOUR
        value: "120"
      - key: AUDIO_ANALYSIS_CONCURRENCY
        value: "2"
      - key: AUDIO_TRACK_GAP_MS
        value: "750"
      - key: RENDER_CONCURRENCY
        value: "1"
