services:
  - type: web
    name: autoframes-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: MAX_TOTAL_SIZE_MB
        value: "2048"
      - key: MAX_IMAGE_COUNT
        value: "500"
      - key: PROJECT_TTL_HOURS
        value: "24"
      - key: OPENAI_TRANSCRIPTION_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_LANGUAGE
        value: "ru"
      - key: OPENAI_TRANSCRIPTION_MAX_MINUTES_PER_HOUR
        value: "120"
      - key: AUDIO_ANALYSIS_CONCURRENCY
        value: "2"
      - key: RENDER_CONCURRENCY
        value: "1"
