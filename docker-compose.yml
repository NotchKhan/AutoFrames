services:
  backend:
    build:
      context: ./backend
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      MAX_FILE_SIZE_MB: "100"
      MAX_TOTAL_SIZE_MB: "2048"
      MAX_IMAGE_COUNT: "500"
      MAX_AUDIO_TRACKS: "${MAX_AUDIO_TRACKS:-20}"
      PROJECT_TTL_HOURS: "24"
      STORAGE_RESERVE_PERCENT: "${STORAGE_RESERVE_PERCENT:-10}"
      SCRATCH_RESERVE_MIN_MB: "${SCRATCH_RESERVE_MIN_MB:-64}"
      SCRATCH_RESERVE_MAX_MB: "${SCRATCH_RESERVE_MAX_MB:-128}"
      OPENAI_TRANSCRIPTION_ENABLED: "${OPENAI_TRANSCRIPTION_ENABLED:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_BASE_URL: "${OPENAI_API_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_TRANSCRIPTION_LANGUAGE: "${OPENAI_TRANSCRIPTION_LANGUAGE:-}"
      OPENAI_TRANSCRIPTION_TIMEOUT_SECONDS: "${OPENAI_TRANSCRIPTION_TIMEOUT_SECONDS:-600}"
      OPENAI_TRANSCRIPTION_MAX_MINUTES_PER_HOUR: "${OPENAI_TRANSCRIPTION_MAX_MINUTES_PER_HOUR:-120}"
      AUDIO_MINIMUM_SCENE_MS: "${AUDIO_MINIMUM_SCENE_MS:-700}"
      AUDIO_SILENCE_NOISE_DB: "${AUDIO_SILENCE_NOISE_DB:--35}"
      AUDIO_MINIMUM_SILENCE_MS: "${AUDIO_MINIMUM_SILENCE_MS:-280}"
      AUDIO_ANALYSIS_CONCURRENCY: "${AUDIO_ANALYSIS_CONCURRENCY:-2}"
      RENDER_CONCURRENCY: "${RENDER_CONCURRENCY:-1}"
      FFMPEG_RENDER_THREADS: "${FFMPEG_RENDER_THREADS:-1}"
      STORAGE_ROOT: /data
      SCRATCH_ROOT: /tmp/autoframes/work
      OUTPUT_ROOT: /data/output
    ports:
      - "8000:8000"
    volumes:
      - autoframes-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
        ALLOW_LOOPBACK_API_URL: "true"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  autoframes-data:
