services:
  backend:
    build:
      context: ./backend
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      MAX_FILE_SIZE_MB: "100"
      MAX_TOTAL_SIZE_MB: "2048"
      MAX_IMAGE_COUNT: "500"
      PROJECT_TTL_HOURS: "24"
      STORAGE_ROOT: /data
    ports:
      - "8000:8000"
    volumes:
      - autoframes-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  autoframes-data:
