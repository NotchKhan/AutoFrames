name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Установить FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Установить зависимости
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Запустить тесты
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend · lint и build
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости
        working-directory: frontend
        run: npm ci
      - name: Проверить TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Проверить ESLint
        working-directory: frontend
        run: npm run lint
      - name: Собрать production-версию
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  containers:
    name: Docker Compose · build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Проверить Compose
        run: docker compose config --quiet
      - name: Собрать контейнеры
        run: docker compose build
